<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lagreton eBench</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
:root{--accent:#FF5A47;--ink:#FFFFFF;--muted:#D1D1D6;--faint:#C7C7CC;--warn:#FFC24D}
html,body,#app{height:100%;margin:0;overflow:hidden}
body{background:#1A1A1D;color:var(--ink);font-family:Geist,system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
/* A Mac app: panels scroll, but no scroll bars ever show. */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
a{color:var(--ink)}
::selection{background:var(--accent);color:#1A1A1D}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
h1,h2,h3,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}

.k-root{height:100%;box-sizing:border-box;position:relative;overflow:hidden;background:linear-gradient(160deg,#3A3A40 0%,#232327 50%,#161618 100%)}
.k-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1.3px);background-size:16px 16px;pointer-events:none}
.k-glass{border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 30px 70px rgba(0,0,0,.32);backdrop-filter:blur(44px) saturate(180%);-webkit-backdrop-filter:blur(44px) saturate(180%)}
.k-dark{background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.30));border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 30px 70px rgba(0,0,0,.32)}
.k-well{border-radius:14px;background:rgba(0,0,0,.16);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.k-btn{height:30px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;font-size:13px;text-decoration:none;color:var(--ink);transition:background .25s cubic-bezier(.16,1,.3,1)}
.k-btn:hover:not(:disabled){background:rgba(255,255,255,.2)}
.k-btn:disabled{color:var(--faint)}
.k-icon{width:32px;height:32px;flex:0 0 auto;border-radius:999px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.k-icon:hover{background:rgba(255,255,255,.14)}
.k-h2{font-size:14px;font-weight:600}
.k-cap{font-size:12px;color:var(--faint)}
.k-mono{font-family:'Geist Mono',ui-monospace,monospace}
.k-doto{font-family:Doto,Geist,sans-serif;font-weight:900;letter-spacing:-.01em}
.k-h3{font-size:13px;font-weight:600}
.k-lab{font-size:11px;color:var(--faint)}
.k-sm{height:26px;padding:0 10px;font-size:12px}
.k-chip{height:24px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.k-in{height:30px;box-sizing:border-box;width:100%;padding:0 10px;border-radius:9px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.22);font-size:13px;color:var(--ink);outline:none;appearance:none;-webkit-appearance:none;transition:border-color .2s}
.k-in:focus{border-color:rgba(255,255,255,.6)}
.k-in::placeholder{color:#AEAEB2}
select.k-in option{background:#2C2C30;color:#FFFFFF}
.k-field{height:34px;box-sizing:border-box;width:100%;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.22);font-size:14px;outline:none;transition:border-color .2s}
.k-field:focus{border-color:rgba(255,255,255,.6)}
.k-field::placeholder{color:#AEAEB2}
.k-primary{height:32px;padding:0 16px;border-radius:999px;border:0;background:#FFFFFF;color:#1A1A1D;font-weight:600;font-size:13px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.08),0 10px 26px rgba(0,0,0,.3);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.k-primary:disabled{background:rgba(255,255,255,.10);color:var(--faint);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}

@keyframes k-breathe{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes k-flicker{0%,100%{opacity:.35}12%{opacity:1}22%{opacity:.5}36%{opacity:.95}54%{opacity:.4}72%{opacity:1}}
@keyframes k-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes k-halo{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes k-drift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-3%,2%,0)}}
.k-breathe{animation:k-breathe 3.2s cubic-bezier(.16,1,.3,1) infinite}
.k-flicker{animation:k-flicker 1.1s steps(1) infinite}
.k-line{animation:k-rise .5s cubic-bezier(.16,1,.3,1) both}
.k-view{animation:k-rise .45s cubic-bezier(.16,1,.3,1) both}
.k-halo{animation:k-halo 4.5s ease-in-out infinite}
.k-halo.busy{animation-duration:1.2s}
.k-drift{animation:k-drift 30s ease-in-out infinite}
.k-thumb{transition:left .55s cubic-bezier(.34,1.56,.64,1)}
.k-card{transition:transform .5s cubic-bezier(.34,1.56,.64,1),background .3s cubic-bezier(.16,1,.3,1),box-shadow .4s cubic-bezier(.16,1,.3,1),border-color .3s}
.k-card:hover{background:rgba(255,255,255,.12)}
.k-side{transition:background .25s cubic-bezier(.16,1,.3,1)}
.k-side:hover{background:rgba(255,255,255,.10)}
.k-bar{transition:background .18s linear}
.k-fill{transition:width .2s linear}
@keyframes k-fade{from{opacity:0}to{opacity:1}}
@keyframes k-drop{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
.k-drop{animation:k-drop .45s cubic-bezier(.16,1,.3,1) both}
@keyframes k-sheet{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.k-sheet{animation:k-sheet .6s cubic-bezier(.34,1.56,.64,1) both}
.k-fade{animation:k-fade .35s ease both}
@media (prefers-reduced-motion:reduce){.k-breathe,.k-flicker,.k-line,.k-view,.k-halo,.k-drift,.k-sheet,.k-fade,.k-drop{animation:none}.k-thumb,.k-card,.k-bar{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>

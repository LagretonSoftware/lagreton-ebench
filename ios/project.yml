# The iPhone companion. Make the Xcode project with XcodeGen (brew install xcodegen), from this folder:
#   xcodegen && open eBench.xcodeproj
# .github/workflows/ios.yml builds the unsigned .ipa that iloader signs and installs.
name: eBench
options:
  bundleIdPrefix: com.lagreton
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"  # CI passes pyproject.toml's version
    CURRENT_PROJECT_VERSION: "1"
targets:
  eBench:
    type: application
    platform: iOS
    scheme: {}  # a shared scheme, for xcodebuild -scheme
    sources:
      - path: eBench
    info:
      path: eBench/Info.plist
      properties:
        CFBundleDisplayName: eBench
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: eBench scans the pairing code your Mac shows.
        NSLocalNetworkUsageDescription: eBench talks to eBench on your Mac over your Wi-Fi.
        # Traffic only ever goes to the paired Mac, and Remote.swift checks its certificate against the pin.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # A code scanned with the Camera app opens eBench and pairs it.
        CFBundleURLTypes:
          - CFBundleURLName: com.lagreton.ebench.pair
            CFBundleURLSchemes: [ebench]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lagreton.ebench.remote
        PRODUCT_NAME: eBench
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
